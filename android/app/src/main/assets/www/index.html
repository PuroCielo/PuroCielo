    </div>
    <div class="mini-right">
      <button class="icon-btn" id="m-like" data-act="like" aria-label="Нравится"></button>
      <div class="vol"><button class="icon-btn" id="m-mute" data-act="mute" aria-label="Звук"></button><input type="range" class="range" id="mini-vol" min="0" max="100" value="85" aria-label="Громкость"></div>
      <button class="icon-btn" id="m-lyrics" data-act="open-lyrics" aria-label="Текст"></button>
      <button class="icon-btn" id="m-queue" data-act="open-queue" aria-label="Очередь"></button>
      <button class="icon-btn" id="m-expand" data-act="open" aria-label="Развернуть"></button>
    </div>
    <button class="mini-m-play" id="mm-play" data-act="toggle" aria-label="Играть / пауза"></button>
    <button class="mini-m-next" id="mm-next" data-act="next" aria-label="Следующий"></button>
  </div>

  <!-- Now Playing -->
  <section id="np" class="np" data-pane="player" aria-hidden="true" aria-label="Сейчас играет">
    <div class="np-bg"><img id="np-bg" alt=""></div>
    <header class="np-top">
      <button class="icon-btn lg" id="np-close" aria-label="Свернуть"></button>
      <div class="seg np-tabs" id="np-tabs">
        <button data-pane="player" class="only-mobile">Плеер</button>
        <button data-pane="lyrics">Текст</button>
        <button data-pane="queue">Очередь</button>
      </div>
      <span class="np-top-sp"></span>
    </header>
    <div class="np-body">
      <div class="np-player">
        <div class="np-art" id="np-art"><div class="np-cover" id="np-cover"></div></div>
        <canvas id="np-viz" class="np-viz" aria-hidden="true"></canvas>
        <div class="np-meta">
          <div class="np-titles"><h2 id="np-title"></h2><p id="np-artist"></p><p class="np-album" id="np-album"></p></div>
          <button class="icon-btn lg" id="np-like" data-act="like" aria-label="Нравится"></button>
          <button class="icon-btn lg" id="np-more" data-action="np-menu" aria-label="Ещё"></button>
        </div>
        <div class="np-chips" id="np-chips"></div>
        <div class="np-seek">
          <input type="range" class="range big" id="np-seek" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
          <div class="np-times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
        </div>
        <div class="np-ctrl">
          <button class="icon-btn" id="n-shuffle" data-act="shuffle" aria-label="Перемешать"></button>
          <button class="icon-btn xl" id="n-prev" data-act="prev" aria-label="Предыдущий"></button>
          <button class="play-btn xl" id="n-play" data-act="toggle" aria-label="Играть / пауза"></button>
          <button class="icon-btn xl" id="n-next" data-act="next" aria-label="Следующий"></button>
          <button class="icon-btn" id="n-repeat" data-act="repeat" aria-label="Повтор"></button>
        </div>
        <div class="np-vol"><button class="icon-btn" id="n-mute" data-act="mute" aria-label="Звук"></button><input type="range" class="range" id="np-vol" min="0" max="100" value="85" aria-label="Громкость"><span class="vol-ic" id="n-vol-hi"></span><button class="icon-btn only-desktop" id="n-queue" data-act="open-queue" aria-label="Очередь"></button></div>
      </div>
      <div class="np-side">
        <div class="pane pane-lyrics" id="np-lyrics"></div>
        <div class="pane pane-queue" id="np-queue"></div>
        <button class="btn btn-soft sm ly-fab" id="ly-fab" hidden></button>
      </div>
    </div>
  </section>
</div>

<div id="drop" class="drop"><div class="drop-card"><div class="drop-ic" id="drop-ic"></div><h2>Отпустите, чтобы добавить</h2><p>MP3 · FLAC · AAC · OGG · WAV · .lrc · .m3u</p></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="popover-root"></div>
<div id="modal-root"></div>
<input type="file" id="file-input" hidden multiple accept="audio/*,.mp3,.flac,.ogg,.oga,.opus,.wav,.m4a,.aac,.mp4,.lrc,.m3u,.m3u8">
<input type="file" id="dir-input" hidden multiple webkitdirectory>
<input type="file" id="backup-input" hidden accept=".json,application/json">
<input type="file" id="m3u-input" hidden accept=".m3u,.m3u8">
<script src="dist/app.js"></script>
</body>
</html>
