plugins { id 'com.android.application' }

// Версия одна на весь проект — в web/package.json
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../web/package.json')).version
def appVersionCode = appVersion.tokenize('.').collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

android {
    namespace 'com.purocielo.player'
    compileSdk 34
    defaultConfig {
        applicationId 'com.purocielo.player'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
    }
    signingConfigs {
        if (System.getenv('PURO_SIGNING_KEYSTORE')) {
            persistent {
                storeFile file(System.getenv('PURO_SIGNING_KEYSTORE'))
                storePassword System.getenv('PURO_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('PURO_SIGNING_KEY_ALIAS') ?: 'purocielo'
                keyPassword System.getenv('PURO_SIGNING_KEY_PASSWORD') ?: System.getenv('PURO_SIGNING_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('PURO_SIGNING_KEYSTORE')) signingConfig signingConfigs.persistent }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
