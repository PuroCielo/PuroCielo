name: Release Windows
# Выкладывает установщик для Windows в отдельный релиз (не «последний» — последним всегда идёт APK).
# Запуск: положите новый установщик в репозиторий, затем Actions → Release Windows → Run workflow
# (версия и путь к .exe), после выкладки файл из репозитория можно удалить.
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Версия, например 1.7.0', required: true, default: '1.7.0' }
      file: { description: 'Путь к установщику в репозитории', required: true, default: 'PuroCielo-Setup.exe' }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp "${{ inputs.file }}" PuroCielo-Setup.exe || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ inputs.version }}
          name: Puro Cielo для Windows ${{ inputs.version }}
          body: Установщик для Windows.
          make_latest: false
          files: PuroCielo-Setup.exe
