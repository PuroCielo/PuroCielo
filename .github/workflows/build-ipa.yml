name: Build IPA
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'android/app/src/main/assets/www/**']
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Веб-файлы плеера внутрь приложения
        run: |
          rm -rf ios/www && mkdir -p ios/www
          cp -R android/app/src/main/assets/www/. ios/www/
      - name: Сгенерировать проект
        run: cd ios && xcodegen generate
      - name: Собрать без подписи
        run: |
          cd ios
          xcodebuild -project PuroCielo.xcodeproj -scheme PuroCielo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Упаковать в .ipa
        run: |
          cd ios
          rm -rf Payload PuroCielo.ipa && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PuroCielo.app Payload/
          zip -qry PuroCielo.ipa Payload
          mkdir -p ../downloads
          mv PuroCielo.ipa ../downloads/PuroCielo.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PuroCielo-ipa
          path: downloads/PuroCielo.ipa
      - name: Положить IPA на сайт
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- ios/www/.gitkeep 2>/dev/null || true
          git add downloads/PuroCielo.ipa
          git commit -m "Обновлён IPA [skip ci]" || echo "без изменений"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
