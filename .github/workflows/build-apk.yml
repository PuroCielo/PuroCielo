name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleDebug --no-daemon
      - name: Положить APK на сайт, чтобы он скачивался прямо со страницы
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/PuroCielo.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/PuroCielo.apk
          git commit -m "Обновлён APK [skip ci]" || echo "без изменений"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: Puro Cielo 1.5.0
          files: downloads/PuroCielo.apk
