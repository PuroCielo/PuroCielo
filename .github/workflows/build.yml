name: Build
# Пуш в web/** или android/**: собирает веб-плеер из исходников (web/) и APK, выкладывает APK в GitHub Releases.
# Версия — из web/package.json. Ссылка на сайте всегда ведёт на последний релиз:
#   https://github.com/PuroCielo/PuroCielo/releases/latest/download/PuroCielo.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'android/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PURO_SIGNING_STORE_PASSWORD: ${{ secrets.PURO_SIGNING_STORE_PASSWORD }}
      PURO_SIGNING_KEY_ALIAS: ${{ secrets.PURO_SIGNING_KEY_ALIAS }}
      PURO_SIGNING_KEY_PASSWORD: ${{ secrets.PURO_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Собрать веб-плеер из web/
        run: |
          npm i --prefix web --no-save --no-audit --no-fund typescript@5
          npx --prefix web playwright install chromium --with-deps
          npm test --prefix web
          node web/build.js
          echo "VERSION=$(node -p "require('./web/package.json').version")" >> "$GITHUB_ENV"
      - name: Закоммитить сборку, если она отличается
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A android/app/src/main/assets/www app index.html
          git commit -m "Сборка веб-плеера ${VERSION} [skip ci]" || echo "сборка не изменилась"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore configured Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PURO_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os, base64, pathlib
          key = os.environ.get('KEYSTORE_BASE64', '')
          if key:
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'purocielo-signing.keystore'
              target.write_bytes(base64.b64decode(key, validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'PURO_SIGNING_KEYSTORE={target}\n')
          else:
              print('::warning::No persistent signing key configured. See android/README.md before upgrading an installed APK.')
          PY
      - run: gradle -p android assembleDebug --no-daemon
      - run: gradle -p android testDebugUnitTest --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PuroCielo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Puro Cielo ${{ env.VERSION }}
          make_latest: true
          files: PuroCielo.apk
