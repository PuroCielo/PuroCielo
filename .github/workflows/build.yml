name: Build
# Пуш в web/** или android/**: собирает веб-плеер из исходников (web/) и APK, выкладывает APK в GitHub Releases.
# Версия — из web/package.json. Ссылка на сайте всегда ведёт на последний релиз:
#   https://github.com/PuroCielo/PuroCielo/releases/latest/download/PuroCielo.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'android/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Собрать веб-плеер из web/
        run: |
          npm i -g typescript@5
          node web/build.js
          echo "VERSION=$(node -p "require('./web/package.json').version")" >> "$GITHUB_ENV"
      - name: Закоммитить сборку, если она отличается
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A android/app/src/main/assets/www app index.html
          git commit -m "Сборка веб-плеера ${VERSION} [skip ci]" || echo "сборка не изменилась"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PuroCielo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Puro Cielo ${{ env.VERSION }}
          make_latest: true
          files: PuroCielo.apk
