/* =====================================================================
   Puro Cielo — серо-белый плеер в духе Apple Music
   ===================================================================== */
:root {
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --accent: #F5F5F7;
  --accent-2: #FFFFFF;
  --accent-fg: #F5F5F7;               /* светлый акцент как цвет текста / иконок */
  --accent-ink: #151517;              /* текст на светлом акценте */
  --accent-soft: rgba(255, 255, 255, .12);
  --bg: #111113;
  --bg-side: rgba(24, 24, 27, .78);
  --card: #1c1c1f;
  --card-2: #26262a;
  --hover: rgba(255, 255, 255, .08);
  --line: rgba(255, 255, 255, .1);
  --text: #F5F5F7;
  --text-2: rgba(245, 245, 247, .66);
  --text-3: rgba(245, 245, 247, .38);
  --track: rgba(255, 255, 255, .2);
  --glass: rgba(30, 30, 33, .74);
  --menu: rgba(40, 40, 44, .88);
  --thumb: #FFFFFF;
  --grad: linear-gradient(140deg, #FFFFFF 0%, #D9D9DE 55%, #A9A9B0 100%);
  --shadow: 0 24px 60px -18px rgba(0, 0, 0, .7);
  --shadow-card: 0 14px 34px -14px rgba(0, 0, 0, .65);
  --danger: #ff6b5e;
  --side-w: 264px;
  --ease: cubic-bezier(.32, .72, 0, 1);
  color-scheme: dark;
}
/* Светлая тема — бело-серая: белый фон, графитовые акценты */
:root[data-theme="light"] {
  --accent: #2C2C2E;
  --accent-2: #48484A;
  --accent-fg: #2C2C2E;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 0, 0, .08);
  --bg: #F5F5F7;
  --bg-side: rgba(255, 255, 255, .78);
  --card: #FFFFFF;
  --card-2: #E8E8EC;
  --hover: rgba(0, 0, 0, .06);
  --line: rgba(0, 0, 0, .09);
  --text: #1D1D1F;
  --text-2: rgba(29, 29, 31, .66);
  --text-3: rgba(29, 29, 31, .4);
  --track: rgba(0, 0, 0, .14);
  --glass: rgba(255, 255, 255, .78);
  --menu: rgba(255, 255, 255, .92);
  --thumb: #2C2C2E;
  --grad: linear-gradient(140deg, #48484A, #1C1C1E);
  --shadow: 0 24px 60px -20px rgba(0, 0, 0, .28);
  --shadow-card: 0 14px 30px -14px rgba(0, 0, 0, .3);
  --danger: #d6372a;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; letter-spacing: -.011em; transition: background .4s, color .4s; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
img { display: block; max-width: 100%; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: var(--track) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--track); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }

.ic { width: 22px; height: 22px; flex: none; }

/* ---------- кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 999px;
  font-weight: 600; font-size: 15px; letter-spacing: -.01em; transition: transform .2s var(--ease), background .2s, box-shadow .25s, opacity .2s; white-space: nowrap;
}
.btn .ic { width: 18px; height: 18px; }
.btn:active { transform: scale(.96); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px -10px var(--accent); }
.btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
.btn-soft { background: var(--hover); color: var(--text); }
.btn-soft:hover { background: var(--line); }
.btn-glass { background: rgba(0, 0, 0, .45); color: #fff; backdrop-filter: blur(14px); }
.btn-glass:hover { background: rgba(0, 0, 0, .6); }
.btn-danger.btn-primary { background: var(--danger); color: #fff; box-shadow: none; }
.btn-soft.btn-danger { color: var(--danger); }

.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--text-2);
  transition: color .2s, background .2s, transform .2s var(--ease);
}
.icon-btn .ic { width: 20px; height: 20px; }
.icon-btn:hover { color: var(--text); background: var(--hover); }
.icon-btn:active { transform: scale(.9); }
.icon-btn.sm { width: 28px; height: 28px; } .icon-btn.sm .ic { width: 16px; height: 16px; }
.icon-btn.lg { width: 42px; height: 42px; } .icon-btn.lg .ic { width: 24px; height: 24px; }
.icon-btn.xl { width: 56px; height: 56px; color: var(--text); } .icon-btn.xl .ic { width: 30px; height: 30px; }
.icon-btn.on { color: var(--accent-fg); background: var(--accent-soft); }
.like.on { color: var(--accent-fg); }
.play-btn {
  display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  transition: transform .25s var(--ease), background .2s, box-shadow .3s; box-shadow: 0 10px 28px -10px var(--accent);
}
.play-btn .ic { width: 22px; height: 22px; }
.play-btn:hover { transform: scale(1.07); background: var(--accent-2); }
.play-btn:active { transform: scale(.94); }
.play-btn.xl { width: 76px; height: 76px; } .play-btn.xl .ic { width: 34px; height: 34px; }

/* ---------- ползунки ---------- */
.range {
  --p: 0%; -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer; display: block;
}
.range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); transition: height .15s; }
.range::-moz-range-track { height: 4px; border-radius: 4px; background: var(--track); }
.range::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--thumb); box-shadow: 0 1px 6px rgba(0, 0, 0, .5); transform: scale(0); transition: transform .15s; }
.range::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--thumb); transform: scale(0); transition: transform .15s; }
.range:hover::-webkit-slider-thumb, .range:focus-visible::-webkit-slider-thumb, .range:active::-webkit-slider-thumb { transform: scale(1); }
.range:hover::-moz-range-thumb, .range:active::-moz-range-thumb { transform: scale(1); }
.range:hover::-webkit-slider-runnable-track, .range:active::-webkit-slider-runnable-track { height: 6px; }
.range:hover::-webkit-slider-thumb { margin-top: -3px; }
.range.big::-webkit-slider-runnable-track { height: 6px; } .range.big::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -4px; }
.range:focus-visible { outline-offset: 0; }

/* ---------- каркас ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--side-w); padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 6px; z-index: 20;
  background: var(--bg-side); backdrop-filter: blur(30px) saturate(1.6); border-right: 1px solid var(--line); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 14px; font-weight: 800; font-size: 22px; letter-spacing: -.04em; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px -6px var(--accent); }
.brand-mark .ic { width: 20px; height: 20px; }
.search-box {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; background: var(--hover); color: var(--text-3);
  margin: 0 2px 12px; transition: background .2s, box-shadow .2s;
}
.search-box:focus-within { background: var(--card-2); box-shadow: 0 0 0 2px var(--accent); color: var(--text); }
.search-box .ic { width: 18px; height: 18px; display: block; }
.input-bare { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 14.5px; }
.input-bare::placeholder { color: var(--text-3); }
.input-bare::-webkit-search-cancel-button { filter: invert(.6); }
.search-box.big { height: 52px; border-radius: 16px; padding: 0 18px; margin: 0 0 22px; max-width: 680px; font-size: 17px; }
.search-box.big .input-bare { font-size: 17px; } .search-box.big .ic { width: 22px; height: 22px; }

.side-nav, .side-playlists { display: flex; flex-direction: column; gap: 2px; }
.side-link {
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--text); font-weight: 500; font-size: 15px;
  transition: background .2s, color .2s;
}
.side-link .ic { width: 21px; height: 21px; color: var(--accent-fg); }
.side-link:hover { background: var(--hover); }
.side-link.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; } .side-link.active .ic { color: var(--accent-ink); }
.side-link.sub { height: 44px; color: var(--text-2); gap: 10px; } .side-link.sub span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-link.sub.active { color: var(--accent-ink); }
.mini-cov { width: 30px; height: 30px; border-radius: 7px; flex: none; overflow: hidden; display: grid; place-items: center; background: var(--card-2); }
.mini-cov.mosaic { display: grid; grid-template-columns: 1fr 1fr; } .mini-cov img { width: 100%; height: 100%; object-fit: cover; }
.mini-cov .ic, .mini-cov.liked .ic, .mini-cov.new .ic { width: 16px; height: 16px; color: var(--accent-ink) !important; }
.mini-cov.liked { background: var(--grad); } .mini-cov.new { background: var(--accent); }
.mini-cov.ph .ic { width: 16px; height: 16px; color: inherit; }
.side-group { display: flex; align-items: center; justify-content: space-between; padding: 18px 12px 6px; color: var(--text-3); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.side-foot { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.side-profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; transition: background .2s; }
.side-profile:hover { background: var(--hover); }
.sp-text { display: flex; flex-direction: column; min-width: 0; } .sp-text b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .sp-text small { color: var(--text-3); font-size: 12.5px; }

.avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; display: inline-grid; place-items: center; flex: none; background: var(--card-2); font-weight: 700; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.ph { background: var(--grad); color: var(--accent-ink); }
.avatar.xl { width: 132px; height: 132px; font-size: 54px; border: 5px solid var(--bg); box-shadow: var(--shadow-card); }
.avatar-btn { border-radius: 50%; transition: transform .25s var(--ease), box-shadow .2s; } .avatar-btn:hover { transform: scale(1.06); box-shadow: 0 0 0 2px var(--accent); }
.avatar-btn .avatar { width: 40px; height: 40px; }

#main { margin-left: var(--side-w); min-height: 100vh; padding: 28px 44px 56px; transition: padding .3s; }
body.has-mini #main { padding-bottom: 150px; }
.view { max-width: 1500px; margin: 0 auto; }
.view.enter { animation: viewIn .55s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; }

  display: grid; grid-template-columns: 52px minmax(0, 1.6fr) minmax(0, 1fr) 34px 56px 34px; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 12px; cursor: default;

.chip-s.codec { background: var(--accent); color: var(--accent-ink); } .chip-s .ic { width: 13px; height: 13px; } .chip-s.ly-badge { color: var(--accent-fg); background: var(--accent-soft); }
.np-seek { margin-top: 10px; } .np-times { display: flex; justify-content: space-between; color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* ---------- мягкий анимированный фон ---------- */
#app { position: relative; z-index: 1; }

.bg-fx .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; will-change: transform; }
.bg-fx .b1 { width: 52vmax; height: 52vmax; left: -14vmax; top: -18vmax; background: radial-gradient(circle, rgba(255, 255, 255, .13), transparent 68%); animation: drift1 26s ease-in-out infinite alternate; }
.bg-fx .b2 { width: 46vmax; height: 46vmax; right: -16vmax; top: 18vh; background: radial-gradient(circle, rgba(170, 176, 196, .16), transparent 68%); animation: drift2 32s ease-in-out infinite alternate; }
.bg-fx .b3 { width: 40vmax; height: 40vmax; left: 24vw; bottom: -22vmax; background: radial-gradient(circle, rgba(255, 255, 255, .09), transparent 68%); animation: drift3 38s ease-in-out infinite alternate; }
:root[data-theme="light"] .bg-fx .blob { opacity: .8; }

.bg-note.n2 { width: min(34vmin, 300px); left: 24vw; top: 8vh; opacity: .03; animation: noteFloat2 28s ease-in-out infinite alternate; }
.bg-note.n3 { width: min(22vmin, 200px); right: 34vw; top: 46vh; opacity: .025; animation: noteFloat3 34s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate3d(14vw, 12vh, 0) scale(1.15); } }
@keyframes drift2 { to { transform: translate3d(-16vw, -10vh, 0) scale(.9); } }
@keyframes drift3 { to { transform: translate3d(-10vw, -14vh, 0) scale(1.2); } }
@keyframes noteFloat1 { from { transform: translate3d(0, 0, 0) rotate(-6deg); } to { transform: translate3d(-24px, -34px, 0) rotate(5deg); } }
@keyframes noteFloat2 { from { transform: translate3d(0, 0, 0) rotate(10deg); } to { transform: translate3d(30px, 26px, 0) rotate(-4deg); } }
@keyframes noteFloat3 { from { transform: translate3d(0, 0, 0) rotate(-12deg); } to { transform: translate3d(-18px, 30px, 0) rotate(6deg); } }

.swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .4); transition: transform .2s var(--ease), box-shadow .2s; }
.swatch:hover { transform: scale(1.12); } .swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
@media (max-width: 640px) { .setting { flex-direction: column; align-items: flex-start; } .setting-ctl { max-width: 100%; justify-content: flex-start; } }

/* акценты */

:root[data-accent="rose"] { --accent: #FF8FA3; --accent-2: #FFA8B8; --accent-fg: #FF8FA3; --accent-ink: #2a0610; --accent-soft: rgba(255, 143, 163, .16); }
:root[data-accent="sky"] { --accent: #7CC4FF; --accent-2: #9ad3ff; --accent-fg: #7CC4FF; --accent-ink: #04192b; --accent-soft: rgba(124, 196, 255, .16); }
:root[data-accent="mint"] { --accent: #6EE7B7; --accent-2: #8ff0c9; --accent-fg: #6EE7B7; --accent-ink: #032015; --accent-soft: rgba(110, 231, 183, .16); }
:root[data-accent="violet"] { --accent: #B69CFF; --accent-2: #c8b4ff; --accent-fg: #B69CFF; --accent-ink: #130833; --accent-soft: rgba(182, 156, 255, .16); }
:root[data-theme="light"][data-accent="gold"] { --accent: #B8860B; --accent-2: #9a6f06; --accent-fg: #9a6f06; --accent-ink: #fff; }

:root[data-theme="light"][data-accent="sky"] { --accent: #1C7ED6; --accent-2: #1668b3; --accent-fg: #1668b3; --accent-ink: #fff; }
:root[data-theme="light"][data-accent="mint"] { --accent: #0E9F6E; --accent-2: #0b7f58; --accent-fg: #0b7f58; --accent-ink: #fff; }
:root[data-theme="light"][data-accent="violet"] { --accent: #7048E8; --accent-2: #5c38c4; --accent-fg: #5c38c4; --accent-ink: #fff; }
/* размер карточек, углы, плотность, текст песни */
:root[data-card="s"] .rail .card { width: 148px; } :root[data-card="s"] .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
:root[data-card="l"] .rail .card { width: 232px; } :root[data-card="l"] .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
:root[data-corners="sharp"] .card-art:not(.round), :root[data-corners="sharp"] .row-cover, :root[data-corners="sharp"] .lrow-cov:not(.round), :root[data-corners="sharp"] .trow-cov { border-radius: 3px; }
:root[data-density="compact"] .row { padding-top: 2px; padding-bottom: 2px; } :root[data-density="compact"] .lrow { padding-top: 4px; padding-bottom: 4px; } :root[data-density="compact"] .section { margin-bottom: 28px; }
:root[data-lysize="s"] .ly { font-size: clamp(19px, 2vw, 28px); } :root[data-lysize="l"] .ly { font-size: clamp(32px, 3.6vw, 52px); }
:root.no-anim *, :root.no-anim *::before, :root.no-anim *::after { animation: none !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

/* сайдбар: профиль + шестерёнка + тема */
.side-row { display: flex; align-items: center; gap: 2px; } .side-row .side-profile { flex: 1; min-width: 0; }

/* фон: пластинка, частицы, свечение обложки */
.bg-cover { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(110px) saturate(1.6); opacity: 0; transition: opacity 1.2s, background-image .6s; }
.bg-cover.on { opacity: .22; } :root[data-theme="light"] .bg-cover.on { opacity: .3; }
.bg-vinyl { position: absolute; left: calc(var(--side-w) + 3vw); bottom: -6vmin; width: min(46vmin, 420px); aspect-ratio: 1; opacity: .09; }
:root[data-theme="light"] .bg-vinyl { opacity: .12; }
.v-disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, transparent 0 30%, currentColor 30.5% 31%, transparent 31.5%), conic-gradient(from 20deg, currentColor, transparent 18%, currentColor 36%, transparent 55%, currentColor 72%, transparent 90%, currentColor); animation: spin 9s linear infinite; animation-play-state: paused; display: grid; place-items: center; box-shadow: inset 0 0 0 2px currentColor; }
.v-groove { position: absolute; border-radius: 50%; box-shadow: inset 0 0 0 1px currentColor; } .g1 { inset: 8%; } .g2 { inset: 16%; } .g3 { inset: 24%; }
.v-label { width: 32%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); display: grid; place-items: center; box-shadow: 0 0 0 3px currentColor; } .v-label .ic { width: 55%; height: 55%; }
:root.is-playing .v-disc { animation-play-state: running; }
.bg-parts i { position: absolute; bottom: -30px; border-radius: 50%; border: 1px solid currentColor; opacity: 0; animation: partUp linear infinite; will-change: transform; }
@keyframes partUp { 0% { transform: translate3d(0, 0, 0) scale(.6); opacity: 0; } 12% { opacity: .22; } 85% { opacity: .12; } 100% { transform: translate3d(40px, -112vh, 0) scale(1.2); opacity: 0; } }
:root:not(.is-playing) .bg-parts i { animation-duration: 40s !important; }
:root.no-bg-vinyl .bg-vinyl, :root.no-bg-particles .bg-parts, :root.no-bg-cover .bg-cover, :root.no-bg-anim .bg-fx .blob, :root.no-bg-notes .bg-note { display: none; }
@media (max-width: 899px) { .bg-vinyl { left: -12vw; width: 70vw; bottom: 8vh; } }
@media (prefers-reduced-motion: reduce) { .bg-parts i, .v-disc { animation: none; } }

/* заставка */
.splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--bg); transition: opacity .7s ease, visibility .7s; }
.splash.out { opacity: 0; visibility: hidden; }
.splash-in { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; opacity: 0; transform: translateY(10px) scale(.96); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.splash.in .splash-in { opacity: 1; transform: none; }
.splash-mark { width: 96px; height: 96px; border-radius: 26px; background: var(--grad); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); } .splash-mark .ic { width: 56px; height: 56px; }
.splash-name { font-size: 34px; font-weight: 800; letter-spacing: -.04em; } .splash-hi { color: var(--text-2); font-size: 17px; min-height: 1.4em; }
@media (max-width: 899px) {
  .page-head { flex-wrap: wrap; align-items: flex-start; } .page-head > div:first-child { min-width: 0; flex: 1 1 60%; }
  .page-head-r { flex: 1 1 100%; justify-content: space-between; gap: 8px; } .page-head-r .seg-icons { margin-right: auto; }
  .side-row .icon-btn { display: none; }
}
.ly-edit { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line); color: var(--accent-fg); font-weight: 600; }
.ly-edit .ic { width: 13px; height: 13px; } .ly-edit:hover { text-decoration: underline; }
.ly-area { width: 100%; min-height: 220px; resize: vertical; font-family: inherit; line-height: 1.5; margin: 6px 0 12px; }
.ly-empty .btn { margin-top: 8px; }
.sc-link { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 14px 18px; border-radius: 16px; background: var(--card); font-weight: 600; transition: background .2s; }
.sc-link:hover { background: var(--card-2); } .sc-link .ic { width: 18px; height: 18px; color: var(--accent-fg); } .sc-link span { margin-left: auto; color: var(--text-3); font-size: 12.5px; font-weight: 500; }

/* v1.5 */
.settings-page { margin-inline: auto; }
.np-top { display: grid; grid-template-columns: 1fr auto 1fr; } .np-top-sp { justify-self: end; } .np-top #np-close { justify-self: start; }
.pe-edit { width: 30px; height: 30px; margin-left: 8px; vertical-align: middle; color: var(--text-2); background: var(--hover); } .pe-edit .ic { width: 15px; height: 15px; } .profile-id h1 .pe-edit { width: 34px; height: 34px; } .handle .pe-edit { width: 26px; height: 26px; } .handle .pe-edit .ic { width: 13px; height: 13px; }
.ly-actions { position: sticky; bottom: 8px; z-index: 2; display: flex; justify-content: center; padding: 18px 0 6px; pointer-events: none; }
.ly-actions .btn { pointer-events: auto; background: rgba(30, 30, 34, .78); color: #fff; backdrop-filter: blur(14px); box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .6); border: 1px solid rgba(255, 255, 255, .14); }
:root[data-theme="light"] .ly-actions .btn { background: rgba(255, 255, 255, .85); color: #1D1D1F; border-color: rgba(0, 0, 0, .12); }
.ly-actions .btn:hover { background: rgba(60, 60, 66, .9); } :root[data-theme="light"] .ly-actions .btn:hover { background: #fff; }
.ly-edit { display: none; }

.ly-fab { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; background: rgba(34, 34, 38, .82); color: #fff; backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 10px 28px -10px rgba(0, 0, 0, .7); }
.ly-fab:hover { background: rgba(70, 70, 76, .92); } :root[data-theme="light"] .ly-fab { background: rgba(255, 255, 255, .9); color: #1D1D1F; border-color: rgba(0, 0, 0, .12); }
.np[data-pane="queue"] .ly-fab { display: none; }

/* ===== v1.6: пословное караоке, сдвиг, обложка по ширине ===== */
.ly.active .w { display: inline; color: var(--text); transition: color .28s ease-out, text-shadow .4s ease-out; }
.ly.active.wordsync .w { color: var(--text-3); } .ly.active.wordsync .w.sung { color: var(--text-2); }
.ly.active.wordsync .w.cur { color: var(--text); text-shadow: 0 0 24px var(--accent-soft); }
.ly.active.wordsync .w.cur.held { animation: heldGlow 1.6s ease-in-out infinite alternate; } @keyframes heldGlow { from { text-shadow: 0 0 14px var(--accent-soft); } to { text-shadow: 0 0 34px var(--accent-soft), 0 0 6px var(--accent-soft); } }
.ly-off { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(34, 34, 38, .78); color: #fff; backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .14); white-space: nowrap; }
.ly-off[hidden] { display: none; } .ly-off span { padding: 0 8px; opacity: .85; } .ly-off b { font-variant-numeric: tabular-nums; } .ly-off .icon-btn { color: #fff; width: 28px; height: 28px; font-size: 18px; line-height: 1; }
:root[data-theme="light"] .ly-off { background: rgba(255, 255, 255, .9); color: #1D1D1F; border-color: rgba(0, 0, 0, .12); } :root[data-theme="light"] .ly-off .icon-btn { color: #1D1D1F; }
.np[data-pane="queue"] .ly-off { display: none; }
/* обложка на всю ширину блока плеера (если не хватает высоты, снизу обрезается, а не сужается) */
.np-player { --cover: 100%; }
.np-art { width: 100%; max-width: none; aspect-ratio: 1; max-height: 46vh; margin: 0 auto; } .np-viz { width: 100%; }
.np-cover img, .np-cover .cov-img { width: 100%; height: 100%; object-fit: cover; }

/* ===== режим «без текста» ===== */
.np-player { transition: transform .75s var(--ease); }
.np-side { transition: opacity .45s ease, transform .75s var(--ease); }
@media (min-width: 900px) {
  .np.nolyr:not([data-pane="queue"]) .np-player { transform: translateX(var(--shift, 0px)); }
  .np.nolyr:not([data-pane="queue"]) .np-side { opacity: 0; transform: translateX(48px); pointer-events: none; }
}
#np-lyr-toggle { opacity: .55; transition: opacity .2s, background .2s; } #np-lyr-toggle.on { opacity: 1; color: var(--accent-fg); }
.np-top-sp { display: flex; justify-content: flex-end; }

.ly-off .icon-btn { width: auto; min-width: 28px; padding: 0 7px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.ly-off .tap-btn { font-size: 12px; margin-left: 4px; background: rgba(255, 255, 255, .12); } .ly-off.tap .tap-btn { background: var(--accent); color: var(--accent-ink); }
.pane-lyrics.tap-sync .ly { cursor: crosshair; outline: 1px dashed transparent; } .pane-lyrics.tap-sync .ly:hover { color: var(--accent-fg); }
@media (max-width: 520px) { .ly-off { bottom: 58px; max-width: calc(100vw - 24px); overflow-x: auto; } .ly-off span { display: none; } }

/* ===== v1.8: плеер без вкладок, миксы, медиатека, круглая аватарка ===== */
.only-mobile { display: none !important; }
@media (max-width: 899px) { .only-mobile { display: inline-grid !important; } .only-desktop { display: none !important; } }
.np-top-sp { gap: 4px; }
#np-q-toggle.on { color: var(--accent-fg); background: var(--accent-soft); }
@media (max-width: 899px) { #np-lyr-toggle { opacity: 1; } #np-lyr-toggle:not(.on) { color: inherit; background: none; } }
/* вкладки библиотеки дублируют боковую панель — на компьютере их не показываем */
@media (min-width: 900px) { .seg-tabs { display: none; } }
/* аватар в шапке: строго круг, а не овал */
.avatar-btn { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; padding: 0; aspect-ratio: 1; border-radius: 50%; overflow: hidden; align-self: center; }
.avatar-btn .avatar { width: 100%; height: 100%; }
.side-profile .avatar { width: 38px; height: 38px; aspect-ratio: 1; }
/* миксы */
.mix-art { position: relative; width: 100%; height: 100%; aspect-ratio: 1; border-radius: inherit; overflow: hidden; }
.mix-art > .cov { width: 100%; height: 100%; }
.mix-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .78) 0%, rgba(0, 0, 0, .15) 55%, rgba(0, 0, 0, 0) 100%); pointer-events: none; }
.mix-label { position: absolute; left: 10%; right: 10%; bottom: 9%; display: flex; flex-direction: column; gap: 6px; color: #fff; pointer-events: none; }
.mix-label .ic { width: 22px; height: 22px; opacity: .9; }
.mix-label b { font-size: clamp(14px, 1.3vw, 19px); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
.mix-art::before { content: ""; position: absolute; inset: 0; z-index: 0; }
.mix-1 .mix-shade { background: linear-gradient(to top, rgba(0, 0, 0, .8), rgba(255, 143, 163, .18)); }
.mix-2 .mix-shade { background: linear-gradient(to top, rgba(0, 0, 0, .8), rgba(245, 200, 75, .16)); }
.mix-3 .mix-shade { background: linear-gradient(to top, rgba(0, 0, 0, .8), rgba(124, 196, 255, .16)); }
.mix-4 .mix-shade { background: linear-gradient(to top, rgba(0, 0, 0, .8), rgba(182, 156, 255, .16)); }
.mix-5 .mix-shade { background: linear-gradient(to top, rgba(0, 0, 0, .8), rgba(110, 231, 183, .15)); }
.lrow-cov .mix-label, .mini-cov .mix-label { display: none; }
.hero-art .mix-label b { font-size: 22px; }
.mix-art .cov.ph .ic { opacity: 0; }
.ly-empty .btn .ic { width: 16px; height: 16px; color: inherit; }

/* ===== v1.8.1: контент без пустого места слева, кнопки у лайка, обычный текст без обрезки ===== */
.view { max-width: none; margin: 0; }
@media (min-width: 900px) { .rail { margin-right: -44px; padding-right: 44px; } }
.np-meta .icon-btn { flex: none; }
#np-edit .ic, #np-lyr-toggle .ic { width: 22px; height: 22px; }
#np-pane-toggle.on { color: var(--accent-fg); background: var(--accent-soft); }
/* обычный текст (без меток времени): сверху не гаснет, видна первая строка целиком */
.pane-lyrics.plain { -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 90%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0, #000 90%, transparent 100%); }
.pane-lyrics.plain .ly-plain { padding: 8px 0 90px; }
.hero-actions .icon-btn.lg { width: 48px; height: 48px; background: var(--hover); }

/* ===== v1.9: эквалайзер ===== */
.eq-row { display: flex; justify-content: space-between; gap: 10px; padding: 18px 20px 14px; }
.eq-band { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.eq-band b { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
.eq-slider { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 120px; accent-color: var(--text); cursor: pointer; }

/* ===== v1.9: итоги ===== */
.stats-tabs { margin: 0 0 22px; }
.stats-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 30px; }
.kpi { background: var(--card); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.kpi b { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--text-2); font-size: 13px; }
.stats-artists { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.stats-artist { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-radius: 14px; color: var(--text); text-decoration: none; }
.stats-artist:hover { background: var(--hover); }

.stats-days .day { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
.stats-days .day i { width: 100%; min-height: 3px; border-radius: 8px 8px 3px 3px; background: var(--text); opacity: .85; }
.stats-days .day span { font-size: 12px; color: var(--text-2); }
/* умные плейлисты */
.smart-art { position: relative; width: 100%; height: 100%; border-radius: inherit; overflow: hidden; }
.smart-art > .cov { width: 100%; height: 100%; }
.smart-badge { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, .6); color: #fff; backdrop-filter: blur(8px); }
.smart-badge .ic { width: 17px; height: 17px; }

.sm-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }

.sm-field.wide, .sm-check, .sm-count { grid-column: 1 / -1; }

select.input { appearance: auto; }
@media (max-width: 560px) { .sm-form { grid-template-columns: 1fr; } }
/* перевод под строкой текста */
.ly-tr { display: block; font-size: .62em; font-weight: 600; line-height: 1.3; margin-top: 4px; opacity: .7; letter-spacing: 0; }
.ly-plain .ly-tr { font-size: .82em; opacity: .6; margin-top: 2px; }
/* данные трека / MusicBrainz */
.sm-form .wide { grid-column: 1 / -1; }
.ti-note { margin: 0; font-size: 13px; color: var(--text-2); }
.ti-mb { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
.ti-results { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
.ti-res { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; background: none; border: 1.5px solid transparent; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
.ti-res:hover { background: var(--hover); }
.ti-res.on { border-color: var(--text); background: var(--hover); }
.ti-cov { position: relative; width: 44px; height: 44px; border-radius: 8px; background: var(--card-2); display: grid; place-items: center; flex: none; overflow: hidden; color: var(--text-3); }
.ti-cov img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ti-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* аккаунт */
.acc-err { color: #ff8a8a; font-size: 13px; margin: 8px 4px 0; min-height: 0; }

/* пустая обложка плейлиста в боковой панели не растягивается на всю ширину */
.cov.mini-cov { width: 30px; height: 30px; display: grid; }

    });
}
